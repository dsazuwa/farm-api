# Local Docker PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/farm_db
spring.datasource.username=farm_dev
spring.datasource.password=${POSTGRES_PASSWORD}

# Enable the development seed runner
app.seed.enabled=true

# Set logging level for seed package
logging.level.com.farmdesk.api.seed=DEBUG

app.seed.users.patrick.auth-id=${SEED_PATRICK_AUTH_ID}
app.seed.users.nelson.auth-id=${SEED_NELSON_AUTH_ID}
app.seed.users.danielle.auth-id=${SEED_DANIELLE_AUTH_ID}
app.seed.users.okpara.auth-id=${SEED_OKPARA_AUTH_ID}