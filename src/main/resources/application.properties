spring.application.name=farmdesk-api

# Flyway migrations are run separately through IntelliJ
spring.flyway.enabled=false

# Hibernate checks the schema; it does not create or change tables
spring.jpa.hibernate.ddl-auto=validate

# Disable the development seed runner
app.seed.enabled=false

supabase.url=${SUPABASE_URL}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${supabase.url}/auth/v1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${supabase.url}/auth/v1/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256,RS256
spring.security.oauth2.resourceserver.jwt.audiences=authenticated